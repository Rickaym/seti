name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      node: ${{ steps.filter.outputs.node }}
      e2e: ${{ steps.filter.outputs.e2e }}
      ea: ${{ steps.filter.outputs.ea }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE...$HEAD")
          else
            files=$(git ls-files)
          fi
          printf 'changed: %s\n' $files
          has() { if printf '%s\n' $files | grep -qE "$1"; then echo true; else echo false; fi; }
          shared='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig.*\.json)$|^\.github/'
          {
            echo "node=$(has "^(server|ui|shared|e2e|packages|mods|scripts|eslint|ea/src)/|^(eslint|commitlint)\.config\.js$|^knip\.json$|$shared")"
            echo "e2e=$(has "^(server|ui|shared|e2e|packages|mods)/|$shared")"
            echo "ea=$(has '^ea/|^\.github/')"
            echo "android=$(has '^android/|^\.github/')"
          } >> "$GITHUB_OUTPUT"

  static:
    name: static
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm check:text
      - run: pnpm check:site
      - run: pnpm typecheck
        if: needs.changes.outputs.node == 'true'
      - run: pnpm knip
        if: needs.changes.outputs.node == 'true'
      - run: pnpm audit --prod --audit-level moderate
        if: needs.changes.outputs.node == 'true'
      - run: pnpm audit --audit-level high
        if: needs.changes.outputs.node == 'true'
      - run: pnpm -r --filter '!@seti/server' run test
        if: needs.changes.outputs.node == 'true'
      - run: pnpm build
        if: needs.changes.outputs.node == 'true'
      - env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          range="$HEAD"
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..$HEAD"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact -v --exit-code 2 --log-opts="--no-merges --first-parent $range" .
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        continue-on-error: ${{ github.event_name == 'push' }}
        with:
          path: .
          format: cyclonedx-json
          artifact-name: seti-sbom.cdx.json
          upload-artifact: ${{ github.event_name == 'push' }}
          upload-artifact-retention: 1
          syft-version: v1.52.0
          upload-release-assets: false

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint

  server-tests:
    name: server tests (${{ matrix.shard }}/${{ matrix.shards }})
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        shards: [2]
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
        ports:
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          echo "SETI_TEST_DATABASE_URL=postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
          echo "SETI_TEST_REDIS_URL=redis://localhost:${{ job.services.redis.ports['6379'] }}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/seti-codex
          key: codex-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('server/src/runtimes/codex/pin.json') }}
      - run: |
          bin="$(pnpm --silent --filter @seti/server run codex-binary "$HOME/.cache/seti-codex")"
          echo "SETI_CODEX_BIN=$bin" >> "$GITHUB_ENV"
      - working-directory: server
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          JOB_INDEX: ${{ strategy.job-index }}
          JOB_TOTAL: ${{ strategy.job-total }}
        run: |
          test "$SHARDS" = "$JOB_TOTAL"
          test "$SHARD" = "$((JOB_INDEX + 1))"
          all="$(pnpm exec vitest list --filesOnly | sort)"
          parts="$(for shard in $(seq 1 "$SHARDS"); do pnpm exec vitest list --filesOnly --shard="$shard/$SHARDS"; done | sort)"
          test -n "$all"
          test "$all" = "$parts"
          printf '%s shards cover all %s test files\n' "$SHARDS" "$(printf '%s\n' "$all" | wc -l)"
      - run: pnpm --filter @seti/server exec vitest run --shard=${{ matrix.shard }}/${{ matrix.shards }}

  checks:
    name: checks
    needs: [changes, static, lint, server-tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NODE: ${{ needs.changes.outputs.node }}
          CHANGES: ${{ needs.changes.result }}
          STATIC: ${{ needs.static.result }}
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.server-tests.result }}
        run: |
          expected=skipped
          if [[ $NODE == true ]]; then
            expected=success
          fi
          test "$CHANGES" = success
          test "$STATIC" = success
          test "$LINT" = "$expected"
          test "$TESTS" = "$expected"

  e2e-shard:
    name: e2e (${{ matrix.node == 'split' && 'split ' || '' }}${{ matrix.shard }}/${{ matrix.shards }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
        shards: [6]
        node: [inline]
        include:
          - shard: 1
            shards: 3
            node: split
          - shard: 2
            shards: 3
            node: split
          - shard: 3
            shards: 3
            node: split
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
        ports:
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          echo "SETI_TEST_DATABASE_URL=postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
          echo "SETI_TEST_REDIS_URL=redis://localhost:${{ job.services.redis.ports['6379'] }}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
        with:
          playwright-deps: 'true'
      - id: playwright
        run: echo "version=$(pnpm --filter @seti/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @seti/e2e exec playwright install chromium
      - run: pnpm build
      - run: pnpm e2e --shard=${{ matrix.shard }}/${{ matrix.shards }} ${{ matrix.node == 'split' && '--project=desktop' || '' }}
        env:
          SETI_E2E_WORKERS: 2
          SETI_E2E_NODE: ${{ matrix.node }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report-${{ matrix.node }}-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 1

  e2e-webkit:
    name: e2e (webkit)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
        ports:
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          echo "SETI_TEST_DATABASE_URL=postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
          echo "SETI_TEST_REDIS_URL=redis://localhost:${{ job.services.redis.ports['6379'] }}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
        with:
          playwright-deps: 'true'
      - run: pnpm --filter @seti/e2e exec playwright install --with-deps webkit
      - run: pnpm build
      - run: pnpm e2e --project=webkit
        env:
          SETI_E2E_WEBKIT: '1'
          SETI_E2E_WORKERS: 1
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report-webkit
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 1

  e2e:
    name: e2e
    needs: [changes, e2e-shard, e2e-webkit]
    if: always() && needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.e2e-shard.result }}
          WEBKIT: ${{ needs.e2e-webkit.result }}
        run: test "$RESULT" = success && test "$WEBKIT" = success

  ea:
    name: ea
    needs: changes
    if: needs.changes.outputs.ea == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest

  android:
    name: android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          log-accepted-android-sdk-licenses: false
      - run: ./gradlew --no-daemon --stacktrace lint test assembleDebug
