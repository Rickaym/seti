name: setup
description: Install the sandbox and share preview tools, Node, pnpm and workspace dependencies

runs:
  using: composite
  steps:
    - shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        source <(sed -n '/^APT_PREVIEW=(/,/)$/p' scripts/install.sh)
        sudo rm -f /var/lib/man-db/auto-update
        sudo apt-get update -qq
        previews=()
        for pkg in "${APT_PREVIEW[@]}"; do
          policy="$(apt-cache policy "$pkg")"
          if [[ $policy == *'Candidate: '* && $policy != *'Candidate: (none)'* ]]; then
            previews+=("$pkg")
          fi
        done
        printf 'share preview packages: %s\n' "${previews[*]}"
        sudo apt-get install -y -qq --no-install-recommends bubblewrap socat openssh-server ripgrep "${previews[@]}"
        printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
          'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '  include if exists <local/bwrap>' '}' \
          | sudo tee /etc/apparmor.d/bwrap >/dev/null
        sudo apparmor_parser -r /etc/apparmor.d/bwrap
        bwrap --unshare-user --unshare-pid --unshare-net --ro-bind / / --dev /dev --proc /proc true
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      with:
        dest: ${{ runner.temp }}/setup-pnpm
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - shell: bash
      run: command -v node-gyp >/dev/null || npm install -g node-gyp@11
    - shell: bash
      env:
        SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
      run: pnpm install --frozen-lockfile
