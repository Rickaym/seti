[project]
name = "seti-ea"
version = "0.1.0"
description = "Voice executive assistant for Seti"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pipecat-ai[deepgram,elevenlabs,openai,silero,webrtc]==1.13.0",
    "fastapi>=0.115.6,<1",
    "uvicorn>=0.32.0,<1",
    "httpx>=0.28,<1",
    "loguru>=0.7,<1",
    "pydantic>=2.10,<3",
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==2.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.12,<1",
    "pyright>=1.1.400,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seti_ea"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "N", "C4", "PIE", "RET", "TID"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
